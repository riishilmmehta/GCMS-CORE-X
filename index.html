<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>GCMS CORE X — Global Crisis Monitor</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
    </script>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.110/Build/Cesium/Cesium.js">
    </script>
    <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.110/Build/Cesium/Widgets/widgets.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js">
    </script>

    <style>
        /* ── RESET & BASE ── */
        :root {
            --bg-deep: #0a0a1a;
            --bg-panel: rgba(15, 23, 42, 0.6);
            --accent: #818cf8;
            --accent-dark: #4f46e5;
            --accent-glow: rgba(129, 140, 248, 0.4);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --critical: #ef4444;
            --high: #fb923c;
            --medium: #fbbf24;
            --low: #4ade80;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        /* ── LOADING SCREEN ── */
        #loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: var(--bg-deep);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.2s;
        }
        #loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #loader-canvas {
            position: absolute;
            inset: 0;
            z-index: 0;
        }

        .loader-content {
            position: relative;
            z-index: 1;
            text-align: center;
        }

        .loader-brand {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2rem, 8vw, 4.5rem);
            font-weight: 900;
            letter-spacing: 0.15em;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            filter: drop-shadow(0 0 30px var(--accent-glow));
        }

        .loader-sub {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(0.75rem, 2vw, 1rem);
            color: var(--text-secondary);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: 3rem;
        }

        .loader-bar-track {
            width: 280px;
            height: 2px;
            background: var(--glass-border);
            border-radius: 2px;
            overflow: hidden;
            margin: 0 auto;
            position: relative;
        }

        .loader-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-dark), var(--accent));
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .loader-status {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 1rem;
            letter-spacing: 0.1em;
        }

        /* ── CINEMATIC VIEW ── */
        #cinematic-view {
            position: fixed;
            inset: 0;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease, visibility 1s;
            cursor: pointer;
            /* ensure the whole area is clickable */
            pointer-events: auto;
        }
        #cinematic-view.active {
            opacity: 1;
            visibility: visible;
        }

        /* ★ FIX: completely disable pointer events on Cesium and all its children */
        #cesium-cinematic,
        #cesium-cinematic * {
            pointer-events: none !important;
        }

        #cesium-cinematic {
            position: absolute;
            inset: 0;
            z-index: 1;
            width: 100%;   /* FIX: give explicit size */
            height: 100%;  /* FIX: give explicit size */
        }

        .cinematic-vignette {
            position: absolute;
            inset: 0;
            z-index: 2;
            background:
                radial-gradient(ellipse at center bottom, transparent 0%, transparent 40%, var(--bg-deep) 85%),
                linear-gradient(to bottom, var(--bg-deep) 0%, transparent 35%, transparent 65%, var(--bg-deep) 100%);
            pointer-events: none;
        }

        .cinematic-ui {
            position: absolute;
            inset: 0;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 15vh;
            pointer-events: none;
            /* let clicks pass through to parent */;
        }

        .cinematic-brand {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.5rem, 5vw, 3rem);
            font-weight: 700;
            letter-spacing: 0.2em;
            color: var(--text-primary);
            text-shadow: 0 0 40px var(--accent-glow);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1s ease 0.5s forwards;
        }

        .cinematic-tagline {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(0.7rem, 2vw, 0.9rem);
            color: var(--text-secondary);
            letter-spacing: 0.4em;
            text-transform: uppercase;
            margin-top: 1rem;
            opacity: 0;
            animation: fadeInUp 1s ease 0.8s forwards;
        }

        .cinematic-hint {
            position: absolute;
            bottom: 8vh;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            opacity: 0;
            animation: fadeInUp 1s ease 1.5s forwards;
            pointer-events: none;
            /* still doesn't block clicks */;
        }

        .hint-pulse {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 1px solid var(--accent);
            position: relative;
            animation: pulseRing 2s ease-out infinite;
        }
        .hint-pulse::after {
            content: '';
            position: absolute;
            inset: 12px;
            border-radius: 50%;
            background: var(--accent);
            opacity: 0.6;
            animation: pulseCore 2s ease-out infinite;
        }

        .hint-text {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            color: var(--accent);
            text-transform: uppercase;
        }

        /* ── DASHBOARD ── */
        #dashboard {
            position: fixed;
            inset: 0;
            z-index: 50;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1.2s ease 0.3s, visibility 1.2s;
            display: grid;
            grid-template-rows: 60px 1fr;
            grid-template-columns: 320px 1fr 320px;
            grid-template-areas:
                "header header header"
                "left globe right";
            gap: 1px;
            background: var(--bg-deep);
        }

        @media (max-width: 1024px) {
            #dashboard {
                grid-template-columns: 1fr;
                grid-template-rows: 60px 1fr auto;
                grid-template-areas:
                    "header"
                    "globe"
                    "panels";
                overflow-y: auto;
            }
        }

        #dashboard.active {
            opacity: 1;
            visibility: visible;
        }

        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            overflow: hidden;
        }

        /* HEADER */
        .dash-header {
            grid-area: header;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            background: rgba(10, 10, 26, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            z-index: 10;
        }

        .header-brand {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 0.1em;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--low);
            box-shadow: 0 0 8px var(--low);
            animation: blink 2s ease infinite;
        }

        .header-meta {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            gap: 1.5rem;
        }

        /* GLOBE AREA */
        .globe-area {
            grid-area: globe;
            position: relative;
            overflow: hidden;
        }

        #cesium-full {
            position: absolute;
            inset: 0;
        }

        .globe-overlay {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: radial-gradient(circle at center, transparent 50%, var(--bg-deep) 100%);
        }

        /* SIDEBARS */
        .sidebar-left {
            grid-area: left;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            overflow-y: auto;
            z-index: 5;
        }

        .sidebar-right {
            grid-area: right;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            overflow-y: auto;
            z-index: 5;
        }

        @media (max-width: 1024px) {
            .sidebar-left,
            .sidebar-right {
                display: none;
            }
            .mobile-panels {
                grid-area: panels;
                padding: 1rem;
                display: flex;
                flex-direction: column;
                gap: 1rem;
            }
        }

        .panel-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-secondary);
            padding: 0 0.5rem;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .panel-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--glass-border);
            margin-left: 0.75rem;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .stat-card {
            background: var(--glass-highlight);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
            transition: transform 0.2s, border-color 0.2s;
        }
        .stat-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
        }

        .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .stat-value.critical {
            color: var(--critical);
            text-shadow: 0 0 10px rgba(239, 68, 68, 0.4);
        }
        .stat-value.high {
            color: var(--high);
        }

        .stat-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-top: 0.25rem;
        }

        .event-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .event-item {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }
        .event-item:hover {
            background: var(--glass-highlight);
            border-color: var(--accent);
        }
        .event-item.critical {
            border-left-color: var(--critical);
        }
        .event-item.high {
            border-left-color: var(--high);
        }
        .event-item.medium {
            border-left-color: var(--medium);
        }
        .event-item.low {
            border-left-color: var(--low);
        }

        .event-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.25rem;
        }

        .event-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .event-severity {
            font-size: 0.6rem;
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .severity-badge-critical {
            background: rgba(239, 68, 68, 0.15);
            color: var(--critical);
        }
        .severity-badge-high {
            background: rgba(251, 146, 60, 0.15);
            color: var(--high);
        }
        .severity-badge-medium {
            background: rgba(251, 191, 36, 0.15);
            color: var(--medium);
        }
        .severity-badge-low {
            background: rgba(74, 222, 128, 0.15);
            color: var(--low);
        }

        .event-meta {
            font-size: 0.7rem;
            color: var(--text-muted);
            display: flex;
            gap: 0.75rem;
            margin-top: 0.25rem;
        }

        .news-feed {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .news-item {
            padding: 0.75rem;
            border-radius: 8px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            transition: all 0.2s;
        }
        .news-item:hover {
            border-color: var(--accent);
        }

        .news-source {
            font-size: 0.65rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.25rem;
        }
        .news-title {
            font-size: 0.8rem;
            color: var(--text-primary);
            line-height: 1.4;
            font-weight: 500;
        }
        .news-time {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
            font-family: 'JetBrains Mono', monospace;
        }

        /* TOAST */
        #toast-container {
            position: fixed;
            top: 80px;
            right: 20px;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            pointer-events: none;
        }

        .toast {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-left: 3px solid var(--critical);
            border-radius: 8px;
            padding: 1rem 1.25rem;
            min-width: 300px;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(239, 68, 68, 0.1);
            transform: translateX(120%);
            animation: slideInToast 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            pointer-events: all;
        }

        .toast-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.25rem;
        }

        .toast-icon {
            font-size: 1rem;
        }

        .toast-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--critical);
            font-weight: 700;
        }

        .toast-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .toast-meta {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
            font-family: 'JetBrains Mono', monospace;
        }

        /* ANIMATIONS */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulseRing {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(1.6);
                opacity: 0;
            }
        }

        @keyframes pulseCore {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.6;
            }
            50% {
                transform: scale(0.8);
                opacity: 1;
            }
        }

        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.4;
            }
        }

        @keyframes slideInToast {
            to {
                transform: translateX(0);
            }
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--glass-border);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- LOADING SCREEN -->
    <div id="loader">
        <canvas id="loader-canvas"></canvas>
        <div class="loader-content">
            <div class="loader-brand">GCMS CORE X</div>
            <div class="loader-sub">Global Crisis Monitor System</div>
            <div class="loader-bar-track">
                <div class="loader-bar-fill" id="loader-bar"></div>
            </div>
            <div class="loader-status" id="loader-status">Initializing neural link...</div>
        </div>
    </div>

    <!-- CINEMATIC VIEW -->
    <div id="cinematic-view">
        <div id="cesium-cinematic"></div>
        <div class="cinematic-vignette"></div>
        <div class="cinematic-ui">
            <div class="cinematic-brand">GCMS CORE X</div>
            <div class="cinematic-tagline">Real-time Global Crisis Intelligence</div>
            <div class="cinematic-hint">
                <div class="hint-pulse"></div>
                <div class="hint-text">Tap to Access</div>
            </div>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard">
        <div class="dash-header">
            <div class="header-brand">
                <span style="color: var(--accent);">◆</span> GCMS CORE X
            </div>
            <div class="header-meta">
                <span class="status-dot"></span>
                <span>LIVE FEED ACTIVE</span>
                <span id="clock">00:00:00 UTC</span>
            </div>
        </div>

        <div class="sidebar-left">
            <div class="glass-panel" style="padding: 1rem;">
                <div class="panel-title">Crisis Overview</div>
                <div class="stat-grid">
                    <div class="stat-card">
                        <div class="stat-value critical" id="stat-active">0</div>
                        <div class="stat-label">Active Events</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value high" id="stat-alerts">0</div>
                        <div class="stat-label">Alerts</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="stat-confidence">94%</div>
                        <div class="stat-label">Confidence</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="stat-monitored">195</div>
                        <div class="stat-label">Countries</div>
                    </div>
                </div>
            </div>

            <div class="glass-panel" style="padding: 1rem; flex: 1; min-height: 0;">
                <div class="panel-title">Recent Events</div>
                <div class="event-list" id="event-list">
                    <!-- Events injected here -->
                </div>
            </div>
        </div>

        <div class="globe-area">
            <div id="cesium-full"></div>
            <div class="globe-overlay"></div>
        </div>

        <div class="sidebar-right">
            <div class="glass-panel" style="padding: 1rem;">
                <div class="panel-title">Latest Alerts</div>
                <div class="event-list" id="alert-list">
                    <!-- Alerts injected here -->
                </div>
            </div>

            <div class="glass-panel" style="padding: 1rem; flex: 1;">
                <div class="panel-title">Crisis News</div>
                <div class="news-feed" id="news-feed">
                    <!-- News injected here -->
                </div>
            </div>
        </div>
    </div>

    <!-- TOAST CONTAINER -->
    <div id="toast-container"></div>

    <script>
        // ==========================================
        // GLOBAL STATE
        // ==========================================
        window.CESIUM_BASE_URL = 'https://cesium.com/downloads/cesiumjs/releases/1.110/Build/Cesium';
        let crisisData = { earthquakes: [], disasters: [], news: [] };
        let cinematicViewer = null;
        let fullViewer = null;
        let isExpanded = false;

        // ==========================================
        // UTILITIES
        // ==========================================
        const $ = id => document.getElementById(id);
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        function formatTime(date) {
            return new Date(date).toISOString().replace('T', ' ').slice(0, 19) + ' UTC';
        }

        function timeAgo(date) {
            const s = Math.floor((Date.now() - new Date(date)) / 1000);
            if (s < 60) return 'Just now';
            if (s < 3600) return Math.floor(s / 60) + 'm ago';
            if (s < 86400) return Math.floor(s / 3600) + 'h ago';
            return Math.floor(s / 86400) + 'd ago';
        }

        function severityFromMag(mag) {
            if (mag >= 6.5) return 'critical';
            if (mag >= 5.5) return 'high';
            if (mag >= 4.5) return 'medium';
            return 'low';
        }

        // ==========================================
        // THREE.JS LOADING SCREEN
        // ==========================================
        function initLoader() {
            const canvas = $('loader-canvas');
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // Wireframe globe
            const geometry = new THREE.IcosahedronGeometry(2, 2);
            const wireframe = new THREE.WireframeGeometry(geometry);
            const lineMaterial = new THREE.LineBasicMaterial({ color: 0x818cf8, transparent: true, opacity: 0.3 });
            const globe = new THREE.LineSegments(wireframe, lineMaterial);
            scene.add(globe);

            // Inner core
            const coreGeo = new THREE.IcosahedronGeometry(1.9, 1);
            const coreMat = new THREE.MeshBasicMaterial({ color: 0x4f46e5, wireframe: true, transparent: true, opacity: 0.15 });
            const core = new THREE.Mesh(coreGeo, coreMat);
            scene.add(core);

            // Particles
            const particlesGeo = new THREE.BufferGeometry();
            const particleCount = 1500;
            const posArray = new Float32Array(particleCount * 3);
            for (let i = 0; i < particleCount * 3; i++) {
                posArray[i] = (Math.random() - 0.5) * 15;
            }
            particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const particlesMat = new THREE.PointsMaterial({ size: 0.02, color: 0x818cf8, transparent: true, opacity: 0.6 });
            const particles = new THREE.Points(particlesGeo, particlesMat);
            scene.add(particles);

            camera.position.z = 5;

            function animate() {
                if (!$('loader').classList.contains('hidden')) {
                    globe.rotation.y += 0.003;
                    globe.rotation.x += 0.001;
                    core.rotation.y -= 0.002;
                    core.rotation.z += 0.001;
                    particles.rotation.y += 0.0005;
                    renderer.render(scene, camera);
                    requestAnimationFrame(animate);
                }
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // ==========================================
        // DATA FETCHING
        // ==========================================
        async function fetchCrisisData() {
            const results = { earthquakes: [], disasters: [], news: [] };

            try {
                updateLoader(30, 'Connecting to USGS seismic network...');
                const usgsRes = await fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/significant_day.geojson');
                const usgs = await usgsRes.json();
                results.earthquakes = usgs.features || [];
            } catch (e) { console.warn('USGS fetch failed', e); }

            await sleep(400);

            try {
                updateLoader(60, 'Syncing ReliefWeb humanitarian feeds...');
                const reliefRes = await fetch('https://api.reliefweb.int/v1/disasters?appname=gcms-core-x&limit=6&profile=full&preset=latest&fields[include]=name,country,date,status,type');
                const relief = await reliefRes.json();
                results.disasters = relief.data || [];
            } catch (e) { console.warn('ReliefWeb fetch failed', e); }

            await sleep(400);

            try {
                updateLoader(85, 'Pulling GDELT conflict indicators...');
                const gdeltRes = await fetch('https://api.gdeltproject.org/api/v2/geo/geo?query=conflict&format=GeoJSON&timespan=1d');
                const gdelt = await gdeltRes.json();
                results.news = gdelt.features || [];
            } catch (e) { console.warn('GDELT fetch failed', e); }

            updateLoader(100, 'System ready');
            return results;
        }

        function updateLoader(percent, text) {
            $('loader-bar').style.width = percent + '%';
            $('loader-status').textContent = text;
        }

        // ==========================================
        // CESIUM SETUP
        // ==========================================
        function createViewer(containerId, options = {}) {
            return new Cesium.Viewer(containerId, {
                imageryProvider: new Cesium.UrlTemplateImageryProvider({
                    url: 'https://a.tile.openstreetmap.org/{z}/{x}/{y}.png',
                    maximumLevel: 18
                }),
                terrainProvider: new Cesium.EllipsoidTerrainProvider(),
                baseLayerPicker: false,
                geocoder: false,
                homeButton: false,
                sceneModePicker: false,
                navigationHelpButton: false,
                animation: false,
                timeline: false,
                fullscreenButton: false,
                vrButton: false,
                creditContainer: null,
                skyAtmosphere: true,
                ...options
            });
        }

        function initCinematicGlobe() {
            const skyAtmosphere = new Cesium.SkyAtmosphere();
            skyAtmosphere.hueShift = 0.1;
            skyAtmosphere.saturationShift = 0.2;
            skyAtmosphere.brightnessShift = 0.1;

            cinematicViewer = createViewer('cesium-cinematic', {
                skyBox: false,
                skyAtmosphere: skyAtmosphere
            });

            // Dark blue space background
            cinematicViewer.scene.backgroundColor = new Cesium.Color(0.04, 0.04, 0.1, 1);

            // Position for "half globe" cinematic look — camera looking from below/angle
            cinematicViewer.camera.setView({
                destination: Cesium.Cartesian3.fromDegrees(0, -30, 22000000),
                orientation: {
                    heading: Cesium.Math.toRadians(0),
                    pitch: Cesium.Math.toRadians(-75),
                    roll: 0
                }
            });

            // Slow rotation
            cinematicViewer.clock.onTick.addEventListener(() => {
                if (!isExpanded && cinematicViewer) {
                    cinematicViewer.scene.camera.rotate(Cesium.Cartesian3.UNIT_Z, 0.0003);
                }
            });

            // FIX: resize after container is rendered
            setTimeout(() => {
                if (cinematicViewer) {
                    cinematicViewer.resize();
                }
            }, 100);
        }

        function initFullGlobe() {
            fullViewer = createViewer('cesium-full', {
                skyBox: false
            });
            fullViewer.scene.backgroundColor = new Cesium.Color(0.04, 0.04, 0.1, 1);

            fullViewer.camera.setView({
                destination: Cesium.Cartesian3.fromDegrees(0, 15, 18000000),
                orientation: {
                    heading: 0,
                    pitch: Cesium.Math.toRadians(-45),
                    roll: 0
                }
            });

            // Add event markers
            addEventMarkers(fullViewer);
        }

        function addEventMarkers(viewer) {
            crisisData.earthquakes.slice(0, 20).forEach(eq => {
                const [lon, lat, depth] = eq.geometry.coordinates;
                const mag = eq.properties.mag;
                const sev = severityFromMag(mag);
                const colors = {
                    critical: Cesium.Color.fromCssColorString('#ef4444'),
                    high: Cesium.Color.fromCssColorString('#fb923c'),
                    medium: Cesium.Color.fromCssColorString('#fbbf24'),
                    low: Cesium.Color.fromCssColorString('#4ade80')
                };

                viewer.entities.add({
                    position: Cesium.Cartesian3.fromDegrees(lon, lat),
                    point: {
                        pixelSize: Math.max(mag * 3, 8),
                        color: colors[sev],
                        outlineColor: Cesium.Color.WHITE,
                        outlineWidth: 1,
                        scaleByDistance: new Cesium.NearFarScalar(1.5e2, 2.0, 1.5e7, 0.5)
                    },
                    label: {
                        text: `M${mag}`,
                        font: '12px JetBrains Mono',
                        fillColor: Cesium.Color.WHITE,
                        outlineColor: Cesium.Color.BLACK,
                        outlineWidth: 2,
                        style: Cesium.LabelStyle.FILL_AND_OUTLINE,
                        verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
                        pixelOffset: new Cesium.Cartesian2(0, -10)
                    },
                    description: `
                        <div style="color:#f8fafc;font-family:Inter,sans-serif;padding:10px;">
                            <h3 style="font-family:Orbitron;margin:0 0 8px;">${eq.properties.place}</h3>
                            <p><strong>Magnitude:</strong> ${mag}</p>
                            <p><strong>Depth:</strong> ${depth}km</p>
                            <p><strong>Time:</strong> ${new Date(eq.properties.time).toUTCString()}</p>
                            <p><strong>Source:</strong> USGS</p>
                        </div>
                    `
                });
            });
        }

        // ==========================================
        // UI RENDERING
        // ==========================================
        function renderDashboard() {
            const events = [];

            // Combine earthquakes and disasters
            crisisData.earthquakes.slice(0, 8).forEach(eq => {
                events.push({
                    title: eq.properties.place,
                    type: 'Earthquake',
                    severity: severityFromMag(eq.properties.mag),
                    region: eq.properties.place,
                    time: eq.properties.time,
                    source: 'USGS'
                });
            });

            crisisData.disasters.slice(0, 4).forEach(d => {
                const fields = d.fields || {};
                events.push({
                    title: fields.name || 'Unknown Disaster',
                    type: fields.type?.[0]?.name || 'Crisis',
                    severity: 'high',
                    region: fields.country?.[0]?.name || 'Global',
                    time: fields.date?.created,
                    source: 'ReliefWeb'
                });
            });

            // Sort by time
            events.sort((a, b) => new Date(b.time) - new Date(a.time));

            // Update stats
            $('stat-active').textContent = events.length + crisisData.disasters.length;
            $('stat-alerts').textContent = events.filter(e => e.severity === 'critical' || e.severity === 'high').length;

            // Render event list
            const eventList = $('event-list');
            eventList.innerHTML = events.slice(0, 6).map(e => `
                <div class="event-item ${e.severity}">
                    <div class="event-header">
                        <div class="event-title">${e.title}</div>
                        <span class="event-severity severity-badge-${e.severity}">${e.severity}</span>
                    </div>
                    <div class="event-meta">
                        <span>${e.type}</span>
                        <span>•</span>
                        <span>${e.region}</span>
                        <span>•</span>
                        <span>${timeAgo(e.time)}</span>
                    </div>
                </div>
            `).join('');

            // Render alerts (critical + high only)
            const alerts = events.filter(e => e.severity === 'critical' || e.severity === 'high');
            $('alert-list').innerHTML = alerts.slice(0, 5).map(e => `
                <div class="event-item ${e.severity}">
                    <div class="event-header">
                        <div class="event-title">${e.title}</div>
                    </div>
                    <div class="event-meta">
                        <span style="color:var(--${e.severity})">${e.severity.toUpperCase()}</span>
                        <span>•</span>
                        <span>${e.source}</span>
                    </div>
                </div>
            `).join('');

            // Render news
            const newsItems = [];
            if (crisisData.earthquakes[0]) {
                const eq = crisisData.earthquakes[0];
                newsItems.push({
                    source: 'USGS',
                    title: `M${eq.properties.mag} earthquake detected near ${eq.properties.place}`,
                    time: eq.properties.time
                });
            }
            crisisData.disasters.slice(0, 4).forEach(d => {
                const f = d.fields || {};
                newsItems.push({
                    source: 'ReliefWeb',
                    title: f.name || 'Humanitarian update',
                    time: f.date?.created || new Date()
                });
            });

            $('news-feed').innerHTML = newsItems.map(n => `
                <div class="news-item">
                    <div class="news-source">${n.source}</div>
                    <div class="news-title">${n.title}</div>
                    <div class="news-time">${timeAgo(n.time)}</div>
                </div>
            `).join('');
        }

        function showToast(title, subtitle, severity = 'critical') {
            const container = $('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.borderLeftColor = `var(--${severity})`;
            toast.innerHTML = `
                <div class="toast-header">
                    <span class="toast-icon">🚨</span>
                    <span class="toast-label" style="color:var(--${severity})">${severity} ALERT</span>
                </div>
                <div class="toast-title">${title}</div>
                <div class="toast-meta">${subtitle}</div>
            `;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'fadeOut 0.5s ease forwards';
                setTimeout(() => toast.remove(), 500);
            }, 6000);
        }

        // ==========================================
        // TRANSITIONS
        // ==========================================
        async function expandToDashboard() {
            if (isExpanded) return;
            isExpanded = true;

            // Fade out cinematic UI
            document.querySelector('.cinematic-ui').style.opacity = '0';
            document.querySelector('.cinematic-vignette').style.opacity = '0';

            // Animate camera to full view (guarded in case the cinematic
            // globe never initialized successfully)
            if (cinematicViewer) {
                cinematicViewer.camera.flyTo({
                    destination: Cesium.Cartesian3.fromDegrees(0, 15, 18000000),
                    orientation: { pitch: Cesium.Math.toRadians(-45) },
                    duration: 2.5,
                    easingFunction: Cesium.EasingFunction.EXPONENTIAL_OUT
                });
            }

            await sleep(1500);

            // Switch views
            $('cinematic-view').classList.remove('active');
            $('dashboard').classList.add('active');

            // Init full globe after transition
            setTimeout(() => {
                try {
                    initFullGlobe();
                } catch (err) {
                    console.error('Full dashboard globe failed to initialize:', err);
                }
                renderDashboard();

                // Show toast with latest event
                if (crisisData.earthquakes.length > 0) {
                    const latest = crisisData.earthquakes[0];
                    showToast(
                        `M${latest.properties.mag} ${latest.properties.place}`,
                        `${formatTime(latest.properties.time)} • USGS Seismic Network`,
                        severityFromMag(latest.properties.mag)
                    );
                }
            }, 300);

            // Start clock
            setInterval(() => {
                $('clock').textContent = new Date().toISOString().replace('T', ' ').slice(0, 19) + ' UTC';
            }, 1000);
        }

        // ==========================================
        // MAIN FLOW
        // ==========================================
        async function init() {
            initLoader();

            // Fetch data
            crisisData = await fetchCrisisData();

            await sleep(600);

            // Hide loader, show cinematic
            $('loader').classList.add('hidden');
            $('cinematic-view').classList.add('active');

            // Attach tap/click handler FIRST, before any Cesium setup —
            // this guarantees "Tap to Access" always works even if the
            // 3D globe below fails to initialize for any reason.
            const view = $('cinematic-view');
            view.addEventListener('click', expandToDashboard);
            view.addEventListener('touchstart', expandToDashboard, { passive: true });

            // Init cinematic globe (wrapped so a Cesium/WebGL failure
            // can't ever block tap-to-access from working)
            try {
                initCinematicGlobe();
            } catch (err) {
                console.error('Cinematic globe failed to initialize:', err);
            }
        }

        // Start
        init();
    </script>
</body>
</html>
