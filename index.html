/* ═══════════════════════════════════════════════════════════
   DESIGN TOKENS
   ═══════════════════════════════════════════════════════════ */
:root{
  --bg-deep:#0a0a1a;
  --bg-panel:rgba(15,23,42,.62);
  --bg-header:rgba(10,10,26,.88);
  --accent:#818cf8;
  --accent-dark:#4f46e5;
  --accent-glow:rgba(129,140,248,.4);
  --text-primary:#f8fafc;
  --text-secondary:#a3b1c6;
  --text-muted:#7a8aa3;
  --critical:#ef4444;
  --high:#fb923c;
  --medium:#fbbf24;
  --low:#4ade80;
  --glass:rgba(255,255,255,.03);
  --glass-border:rgba(255,255,255,.10);
  --glass-highlight:rgba(255,255,255,.06);
  --shadow:0 8px 32px rgba(0,0,0,.45);
  --focus:#a5b4fc;
  --tap:44px;
  --radius:12px;
}
[data-theme="light"]{
  --bg-deep:#eef2f7;
  --bg-panel:rgba(255,255,255,.75);
  --bg-header:rgba(255,255,255,.9);
  --text-primary:#0f172a;
  --text-secondary:#334155;
  --text-muted:#5b6b82;
  --glass:rgba(255,255,255,.6);
  --glass-border:rgba(0,0,0,.10);
  --glass-highlight:rgba(0,0,0,.04);
  --shadow:0 8px 32px rgba(0,0,0,.12);
  --focus:#4338ca;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg-deep);
  color:var(--text-primary);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:15px;
  line-height:1.5;
  min-height:100vh;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
  transition:background .3s,color .3s;
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--glass-border);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}

.skip-link{
  position:absolute;left:-9999px;top:0;z-index:10000;
  background:var(--accent);color:#0a0a1a;padding:.7rem 1.2rem;
  border-radius:0 0 8px 0;font-weight:700;text-decoration:none;
}
.skip-link:focus{left:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
    scroll-behavior:auto !important;
  }
}

/* ═══════════════════════════════════════════════════════════
   LOADER
   ═══════════════════════════════════════════════════════════ */
#loader{
  position:fixed;inset:0;z-index:9999;
  background:var(--bg-deep);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .9s ease,visibility .9s;
}
#loader.hidden{opacity:0;visibility:hidden;pointer-events:none}
#loader-canvas{
  position:absolute;inset:0;
  width:100%;height:100%;
  display:block;
}
.loader-content{position:relative;z-index:1;text-align:center;padding:1rem;pointer-events:none}
.loader-content .loader-custom{pointer-events:auto}
.loader-brand{
  font-family:'Orbitron',sans-serif;
  font-size:clamp(1.9rem,7vw,4rem);
  font-weight:900;letter-spacing:.14em;
  background:linear-gradient(135deg,var(--text-primary),var(--accent));
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  margin-bottom:.4rem;
}
.loader-sub{
  font-family:'Space Grotesk',sans-serif;
  font-size:clamp(.7rem,1.8vw,.9rem);
  color:var(--text-secondary);
  letter-spacing:.28em;text-transform:uppercase;margin-bottom:2.5rem;
}
.loader-bar-track{
  width:min(280px,72vw);height:3px;background:var(--glass-border);
  border-radius:3px;overflow:hidden;margin:0 auto;
}
.loader-bar-fill{
  height:100%;width:0%;
  background:linear-gradient(90deg,var(--accent-dark),var(--accent));
  transition:width .3s ease;
}
.loader-status{
  font-family:'JetBrains Mono',monospace;
  font-size:.72rem;color:var(--text-muted);
  margin-top:1rem;letter-spacing:.06em;min-height:1.2em;
}
.loader-custom{
  margin-top:1.8rem;display:flex;gap:.6rem;
  align-items:center;justify-content:center;
}
.loader-custom label{font-size:.72rem;color:var(--text-muted)}
.loader-custom input[type="color"]{
  width:34px;height:34px;border:2px solid var(--glass-border);
  border-radius:50%;padding:2px;background:transparent;cursor:pointer;
}
.loader-custom input[type="color"]::-webkit-color-swatch-wrapper{padding:0}
.loader-custom input[type="color"]::-webkit-color-swatch{border:none;border-radius:50%}

/* ═══════════════════════════════════════════════════════════
   CINEMATIC VIEW
   ═══════════════════════════════════════════════════════════ */
#cinematic-view{
  position:fixed;inset:0;z-index:100;
  opacity:0;visibility:hidden;
  transition:opacity 1.2s ease,visibility 1.2s;
  cursor:pointer;background:var(--bg-deep);
  overflow:hidden;
}
#cinematic-view.active{opacity:1;visibility:visible}
#cinematic-canvas{
  position:absolute;inset:0;
  width:100%;height:100%;
  display:block;z-index:1;
}
.cinematic-vignette{
  position:absolute;inset:0;z-index:2;pointer-events:none;
  background:
    radial-gradient(ellipse at 50% 80%,transparent 0%,transparent 50%,rgba(10,10,26,.85) 92%),
    linear-gradient(to bottom,rgba(10,10,26,.35) 0%,transparent 28%,transparent 70%,rgba(10,10,26,.75) 100%);
  transition:opacity .8s;
}
.cinematic-ui{
  position:absolute;inset:0;z-index:3;
  display:flex;flex-direction:column;align-items:center;
  padding-top:10vh;pointer-events:none;transition:opacity .8s;
}
.cinematic-brand{
  font-family:'Orbitron',sans-serif;
  font-size:clamp(1.6rem,5.5vw,3.2rem);
  font-weight:700;letter-spacing:.2em;
  color:var(--text-primary);
  text-shadow:0 0 40px var(--accent-glow);
  opacity:0;transform:translateY(18px);
  animation:fadeInUp 1s ease .4s forwards;
}
.cinematic-tagline{
  font-family:'Space Grotesk',sans-serif;
  font-size:clamp(.68rem,1.8vw,.9rem);
  color:var(--text-secondary);
  letter-spacing:.42em;text-transform:uppercase;
  margin-top:.7rem;text-align:center;padding:0 1rem;
  opacity:0;animation:fadeInUp 1s ease .75s forwards;
}
.cinematic-hint{
  position:absolute;bottom:8vh;left:50%;transform:translateX(-50%);
  z-index:4;
  display:flex;flex-direction:column;align-items:center;gap:.7rem;
  opacity:0;animation:fadeInUp 1s ease 1.3s forwards;
}
.hint-pulse{
  width:52px;height:52px;border-radius:50%;
  border:2px solid var(--accent);position:relative;
  animation:pulseRing 2.4s ease-out infinite;
}
.hint-pulse::after{
  content:'';position:absolute;inset:14px;border-radius:50%;
  background:var(--accent);opacity:.55;
  animation:pulseCore 2.4s ease-out infinite;
}
.hint-text{
  font-family:'Space Grotesk',sans-serif;
  font-size:.75rem;letter-spacing:.22em;
  color:var(--accent);text-transform:uppercase;font-weight:600;
}

@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulseRing{0%{transform:scale(1);opacity:1}100%{transform:scale(1.7);opacity:0}}
@keyframes pulseCore{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(.78);opacity:1}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

   DASHBOARD
